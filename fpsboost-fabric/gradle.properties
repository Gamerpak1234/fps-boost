# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# IMPORTANT: Before building, double check these values against
# https://fabricmc.net/develop/ (select Minecraft version 1.21.11).
# Fabric publishes new loader/API builds often, so double check loader_version
# and fabric_version there too if you still hit errors. (yarn_mappings below
# was confirmed against Fabric's own docs as of this writing.)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.3
loader_version=0.16.14

# Mod Properties
mod_version=1.0.0
maven_group=com.fpsboost
archives_base_name=fpsboost

# Dependencies (Fabric API is required - used for the keybind)
fabric_version=0.141.5+1.21.11
