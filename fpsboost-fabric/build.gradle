plugins {
    // 1.21.11 is still an obfuscated Minecraft version, so this uses the
    // "-remap" plugin ID (the older bare "fabric-loom" ID is legacy/deprecated
    // and was resolving an outdated snapshot, which caused the earlier
    // "Unsupported unpick version" build failure).
    id 'net.fabricmc.fabric-loom-remap' version '+'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

// TEMPORARY diagnostic task: prints the real, current method signatures of
// GameOptions from the actual remapped Minecraft jar using plain Java
// reflection (loading straight from the jar, no extraction needed), so we
// stop guessing method names.
// Run with: gradle dumpGameOptionsApi
tasks.register('dumpGameOptionsApi') {
    doLast {
        def cp = configurations.getByName('compileClasspath')
        def target = cp.files.find {
            it.name.toLowerCase().contains('minecraft') && !it.name.toLowerCase().contains('sources')
        }
        if (target == null) {
            println "No minecraft jar found. Classpath entries:"
            cp.files.each { println " - ${it.name}" }
            return
        }
        println "Using jar: ${target}"
        // Load with the FULL compile classpath (not just the one jar) so
        // every class GameOptions references (Brigadier, Minecraft's own
        // other classes, etc.) can actually be resolved.
        def urls = cp.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, ClassLoader.getSystemClassLoader().parent)
        def clazz = loader.loadClass("net.minecraft.client.option.GameOptions")

        def keywords = ['particle', 'graphic', 'cloud', 'view', 'distance', 'shadow']
        println "===== Matching GameOptions methods ====="
        clazz.declaredMethods
            .findAll { m -> keywords.any { m.name.toLowerCase().contains(it) } }
            .sort { it.name }
            .each { m ->
                println "${java.lang.reflect.Modifier.toString(m.modifiers)} ${m.genericReturnType} ${m.name}(${m.genericParameterTypes.join(', ')})"
            }
        println "===== End ====="
    }
}
