plugins {
    // 1.21.11 is still an obfuscated Minecraft version, so this uses the
    // "-remap" plugin ID (the older bare "fabric-loom" ID is legacy/deprecated
    // and was resolving an outdated snapshot, which caused the earlier
    // "Unsupported unpick version" build failure).
    id 'net.fabricmc.fabric-loom-remap' version '+'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// TEMPORARY diagnostic task: prints the real, current method signatures of
// GameOptions from the actual remapped Minecraft jar, so we stop guessing
// method names. Run with: gradle dumpGameOptionsApi
tasks.register('dumpGameOptionsApi') {
    doLast {
        def cp = configurations.getByName('compileClasspath')
        def target = cp.files.find {
            it.name.toLowerCase().contains('minecraft') && !it.name.toLowerCase().contains('sources')
        }
        if (target == null) {
            println "No minecraft jar found. Classpath entries:"
            cp.files.each { println " - ${it.name}" }
            return
        }
        println "Using jar: ${target}"
        def tmpDir = new File(project.buildDir, "gameoptions-dump")
        tmpDir.deleteDir()
        tmpDir.mkdirs()
        ant.unzip(src: target, dest: tmpDir, overwrite: true) {
            patternset {
                include(name: "net/minecraft/client/option/GameOptions.class")
            }
        }
        def classFile = new File(tmpDir, "net/minecraft/client/option/GameOptions.class")
        if (!classFile.exists()) {
            println "GameOptions.class not found at expected path inside jar."
            return
        }
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'javap', '-p', '-s', classFile.absolutePath
            standardOutput = out
        }
        println "===== GameOptions method signatures ====="
        println out.toString()
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

